<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100">
  <defs>
    <filter id="inkRough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <g filter="url(#inkRough2)" stroke="#2e5c48" fill="none" opacity="0.9">
    <!-- Double border box -->
    <rect x="6" y="6" width="228" height="88" rx="4" stroke-width="2.2" />
    <rect x="11" y="11" width="218" height="78" rx="2" stroke-width="0.9" stroke-dasharray="4 2" />
    
    <!-- Header -->
    <text x="120" y="27" text-anchor="middle" fill="#2e5c48" font-family="'Hanken Grotesk', sans-serif" font-size="8" font-weight="700" letter-spacing="2.8">AI-OFFICE.GE // ADMISSION</text>
    
    <!-- Main Stamp Name -->
    <text x="120" y="53" text-anchor="middle" fill="#2e5c48" font-family="'Bricolage Grotesque', sans-serif" font-size="20" font-weight="800" letter-spacing="3.5">PILOT COHORT</text>
    
    <!-- Divider -->
    <line x1="30" y1="62" x2="210" y2="62" stroke-width="0.8" />
    
    <!-- Sub info -->
    <text x="120" y="76" text-anchor="middle" fill="#2e5c48" font-family="'Hanken Grotesk', monospace" font-size="9" font-weight="600" letter-spacing="1.5">TBILISI, GEORGIA · 2026</text>
  </g>
</svg>
