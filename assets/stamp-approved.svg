<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <path id="circlePath" d="M 100, 100 m -70, 0 a 70,70 0 1,1 140,0 a 70,70 0 1,1 -140,0" fill="none"/>
    <path id="circlePathInner" d="M 100, 100 m -50, 0 a 50,50 0 1,0 100,0 a 50,50 0 1,0 -100,0" fill="none"/>
    <filter id="inkRough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <g filter="url(#inkRough)" stroke="#2e5c48" fill="none" opacity="0.88">
    <!-- Outer scalloped or double ring -->
    <circle cx="100" cy="100" r="92" stroke-width="2.5" stroke-dasharray="8 3" />
    <circle cx="100" cy="100" r="84" stroke-width="1.2" />
    <circle cx="100" cy="100" r="60" stroke-width="1.2" />
    
    <!-- Top & bottom arc text -->
    <text fill="#2e5c48" font-family="'Bricolage Grotesque', sans-serif" font-size="9" font-weight="700" letter-spacing="3.2" text-anchor="middle">
      <textPath href="#circlePath" startOffset="50%">* HUMAN-IN-THE-LOOP * VERIFIED</textPath>
    </text>
    <text fill="#2e5c48" font-family="'Hanken Grotesk', sans-serif" font-size="8" font-weight="600" letter-spacing="2.5" text-anchor="middle">
      <textPath href="#circlePathInner" startOffset="50%">AI OFFICE · BACK OFFICE</textPath>
    </text>
    
    <!-- Center box and text -->
    <rect x="36" y="86" width="128" height="28" fill="#f6f4ee" stroke="#2e5c48" stroke-width="1.8" rx="3" />
    <text x="100" y="105" text-anchor="middle" fill="#2e5c48" font-family="'Bricolage Grotesque', sans-serif" font-size="16" font-weight="800" letter-spacing="3">APPROVED</text>
    
    <text x="100" y="132" text-anchor="middle" fill="#2e5c48" font-family="'Hanken Grotesk', monospace" font-size="8.5" font-weight="700" letter-spacing="1">NO AUTONOMOUS ACTION</text>
  </g>
</svg>
