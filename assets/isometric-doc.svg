<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" fill="none">
  <defs>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2efe7"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#22302a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Base Grid Lines in the background -->
  <g stroke="#d9d5c9" stroke-width="0.8" opacity="0.65">
    <line x1="20" y1="20" x2="300" y2="20" stroke-dasharray="2 3"/>
    <line x1="20" y1="60" x2="300" y2="60" stroke-dasharray="2 3"/>
    <line x1="20" y1="100" x2="300" y2="100" stroke-dasharray="2 3"/>
    <line x1="20" y1="140" x2="300" y2="140" stroke-dasharray="2 3"/>
    <line x1="20" y1="180" x2="300" y2="180" stroke-dasharray="2 3"/>
    <line x1="160" y1="10" x2="160" y2="210" stroke-dasharray="3 3"/>
  </g>

  <!-- Underlying Sheet (Shifted) -->
  <g transform="translate(60, 25) rotate(4)" filter="url(#subtleShadow)">
    <rect width="180" height="150" rx="6" fill="#e9e5da" stroke="#cfc9b8" stroke-width="1.2"/>
    <line x1="20" y1="28" x2="110" y2="28" stroke="#b0a894" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="44" x2="160" y2="44" stroke="#c2bbab" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="56" x2="140" y2="56" stroke="#c2bbab" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="68" x2="150" y2="68" stroke="#c2bbab" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Main Active Document Sheet -->
  <g transform="translate(50, 15) rotate(-2)" filter="url(#subtleShadow)">
    <rect width="190" height="165" rx="7" fill="url(#sheetGrad)" stroke="#2e5c48" stroke-width="1.4"/>
    
    <!-- Ledger Top Bar -->
    <rect x="0" y="0" width="190" height="24" rx="7" fill="#2e5c48"/>
    <rect x="0" y="18" width="190" height="6" fill="#2e5c48"/>
    <text x="12" y="16" fill="#f4f2ea" font-family="'Hanken Grotesk', sans-serif" font-size="7.5" font-weight="700" letter-spacing="1">STATEMENT RECONCILIATION // REF 849</text>
    <circle cx="176" cy="12" r="3" fill="#9db8a9"/>

    <!-- Document Lines / Ledger Table -->
    <!-- Column headers -->
    <line x1="14" y1="38" x2="176" y2="38" stroke="#d9d5c9" stroke-width="1"/>
    <text x="16" y="34" fill="#5b6a62" font-family="'Hanken Grotesk', sans-serif" font-size="6.5" font-weight="700">DATE / ITEM</text>
    <text x="125" y="34" fill="#5b6a62" font-family="'Hanken Grotesk', sans-serif" font-size="6.5" font-weight="700">GEL / STATUS</text>
    
    <!-- Row 1 -->
    <text x="16" y="52" fill="#22302a" font-family="'Hanken Grotesk', sans-serif" font-size="7" font-weight="600">Inv #1092 Bank match</text>
    <text x="130" y="52" fill="#2e5c48" font-family="'Hanken Grotesk', monospace" font-size="7" font-weight="700">+1,450.00</text>
    <path d="M170 48 l3 3 l5 -5" stroke="#2e5c48" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <line x1="14" y1="60" x2="176" y2="60" stroke="#eeebe2" stroke-width="0.8"/>

    <!-- Row 2 -->
    <text x="16" y="74" fill="#22302a" font-family="'Hanken Grotesk', sans-serif" font-size="7" font-weight="600">TBC Wire / Client retain</text>
    <text x="130" y="74" fill="#2e5c48" font-family="'Hanken Grotesk', monospace" font-size="7" font-weight="700">+820.00</text>
    <path d="M170 70 l3 3 l5 -5" stroke="#2e5c48" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <line x1="14" y1="82" x2="176" y2="82" stroke="#eeebe2" stroke-width="0.8"/>

    <!-- Row 3 (Pending approval) -->
    <text x="16" y="96" fill="#22302a" font-family="'Hanken Grotesk', sans-serif" font-size="7" font-weight="600">Vendor payout draft</text>
    <text x="130" y="96" fill="#b98524" font-family="'Hanken Grotesk', monospace" font-size="7" font-weight="700">-340.00</text>
    <circle cx="174" cy="94" r="3.5" fill="#fdf4e2" stroke="#b98524" stroke-width="1.2"/>
    <line x1="14" y1="104" x2="176" y2="104" stroke="#eeebe2" stroke-width="0.8"/>

    <!-- Double Balance Rule at Bottom -->
    <line x1="14" y1="126" x2="176" y2="126" stroke="#2e5c48" stroke-width="1"/>
    <line x1="14" y1="129" x2="176" y2="129" stroke="#2e5c48" stroke-width="1.4"/>
    <text x="16" y="122" fill="#5b6a62" font-family="'Hanken Grotesk', sans-serif" font-size="6.5" font-weight="600">AUTOMATIC PRE-CHECK</text>
    <text x="138" y="122" fill="#2e5c48" font-family="'Hanken Grotesk', sans-serif" font-size="7.5" font-weight="800">100% OK</text>

    <!-- Stamp in corner -->
    <g transform="translate(100, 105) rotate(-8)">
      <rect width="66" height="22" rx="2" fill="#ffffff" fill-opacity="0.9" stroke="#2e5c48" stroke-width="1.5" stroke-dasharray="3 1.5"/>
      <text x="33" y="14" text-anchor="middle" fill="#2e5c48" font-family="'Bricolage Grotesque', sans-serif" font-size="9" font-weight="800" letter-spacing="1.2">CHECKED</text>
    </g>
  </g>
</svg>
