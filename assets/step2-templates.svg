<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <!-- Outer ledger frame -->
  <rect x="8" y="8" width="64" height="64" rx="12" fill="#eeebe2" stroke="#d9d5c9" stroke-width="1.5"/>
  <!-- Stack of catalog rules / templates -->
  <rect x="22" y="18" width="36" height="44" rx="5" fill="#fdfdfb" stroke="#cfc9b8" stroke-width="1.2" transform="rotate(-4 40 40)"/>
  <rect x="22" y="18" width="36" height="44" rx="5" fill="#ffffff" stroke="#2e5c48" stroke-width="1.8"/>
  <!-- Lines representing rules -->
  <line x1="28" y1="28" x2="48" y2="28" stroke="#2e5c48" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="36" x2="52" y2="36" stroke="#9db8a9" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="43" x2="44" y2="43" stroke="#9db8a9" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="50" x2="50" y2="50" stroke="#9db8a9" stroke-width="1.5" stroke-linecap="round"/>
</svg>
